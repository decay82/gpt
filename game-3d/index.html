<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Arena 3D - Hades Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        /* UI Overlay */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
            font-family: 'Arial', sans-serif;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #4ecdc4;
        }

        .stat {
            margin: 5px 0;
            font-size: 14px;
        }

        .stat-label {
            color: #4ecdc4;
            font-weight: bold;
        }

        #hp-bar, #dash-bar {
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        #hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a6ff);
            transition: width 0.3s;
        }

        #dash-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd93d, #ff6b6b);
            transition: width 0.3s;
        }

        #chamber-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ffd93d;
            text-align: right;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #44a6ff;
            font-size: 12px;
        }

        .control-item {
            margin: 3px 0;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
        }

        /* Menu Screen */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            pointer-events: all;
        }

        .screen.active {
            display: flex;
        }

        .menu-content {
            text-align: center;
            color: white;
        }

        .menu-content h1 {
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #4ecdc4;
            color: #4ecdc4;
        }

        .menu-content button {
            font-size: 1.5em;
            padding: 15px 40px;
            margin: 10px;
            background: linear-gradient(45deg, #4ecdc4, #44a6ff);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
            transition: transform 0.2s;
        }

        .menu-content button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay">
            <!-- HUD -->
            <div id="hud">
                <div class="stat">
                    <span class="stat-label">HP:</span> <span id="hp-text">100/100</span>
                    <div id="hp-bar"><div id="hp-fill" style="width: 100%"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">Dash:</span>
                    <div id="dash-bar"><div id="dash-fill" style="width: 100%"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">Level:</span> <span id="level-text">1</span>
                </div>
            </div>

            <!-- Chamber Info -->
            <div id="chamber-info">
                <div style="font-size: 1.5em; color: #ffd93d;">⚔️ Chamber <span id="chamber-num">1</span></div>
                <div style="font-size: 1.2em; margin-top: 5px;">Enemies: <span id="enemies-count">0</span></div>
                <div style="font-size: 1em; margin-top: 5px; color: #ccc;">Kills: <span id="kills-count">0</span></div>
            </div>

            <!-- Controls -->
            <div id="controls">
                <div class="control-item"><strong>WASD:</strong> Move</div>
                <div class="control-item"><strong>Mouse:</strong> Look Around</div>
                <div class="control-item"><strong>Left Click:</strong> Shoot</div>
                <div class="control-item"><strong>Space:</strong> Dash</div>
                <div class="control-item"><strong>Click Screen:</strong> Lock Pointer</div>
            </div>

            <!-- Crosshair -->
            <div id="crosshair"></div>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen active">
            <div class="menu-content">
                <h1>⚔️ SURVIVAL ARENA 3D</h1>
                <p style="font-size: 1.5em; margin-bottom: 30px; color: #4ecdc4;">Hades Edition</p>
                <button id="start-btn">START GAME</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
